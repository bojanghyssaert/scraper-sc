name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Python 3.11 instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Systeemafhankelijkheden installeren (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Python dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntaxis en compilatie valideren
        run: |
          python -m py_compile backend/main.py backend/soundcloud_service.py

      - name: Pytest suite uitvoeren (inclusief security en API tests)
        env:
          PYTHONPATH: .
        run: |
          pytest backend/tests/ -v --tb=short

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Node.js 20 instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Node dependencies installeren
        run: npm ci

      - name: Frontend unit & component tests draaien
        run: npm test

      - name: Vite productiebuild verifiëren
        run: npm run build

  docker:
    name: Docker Build Validatie
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: Docker image bouwen
        run: |
          docker build -t soundcloud-scraper:test .

      - name: Container opstarten en healthcheck controleren
        run: |
          docker run -d --name test-container -p 8000:8000 soundcloud-scraper:test
          sleep 5
          docker ps
          curl -f http://localhost:8000/api/health || (docker logs test-container && exit 1)
          docker stop test-container
